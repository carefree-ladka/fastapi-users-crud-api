# Quality gates run on `git commit`.
# Install once with:  pre-commit install
# Run on all files:   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Linter (with autofix), then formatter.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Always type-check the whole app package (via pyproject config),
        # not just changed files, and give the isolated hook env the deps it
        # needs to resolve the same types as local development.
        pass_filenames: false
        args: ["app"]
        additional_dependencies:
          - fastapi
          - pydantic>=2
          - pydantic[email]
          - sqlalchemy>=2.0
          - python-dotenv
          - pyjwt>=2.8
          - bcrypt>=4.1

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
